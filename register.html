<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Honnesha Café | User Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Montserrat',sans-serif;
}

/* ================= BODY ================= */
body{
  min-height:100vh;
  background:
    linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url("https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1200&q=85");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= REGISTER BOX ================= */
.register-box{
  width:100%;
  max-width:420px;
  background:rgba(11,15,26,0.9);
  backdrop-filter:blur(15px);
  border-radius:30px;
  padding:45px 35px;
  box-shadow:0 30px 60px rgba(0,0,0,0.6);
  animation:fadeUp 1.2s ease;
}

/* ================= TEXT ================= */
.register-box h2{
  text-align:center;
  font-size:32px;
  color:#c77735;
}

.register-box p{
  text-align:center;
  font-size:14px;
  margin:10px 0 35px;
  opacity:0.85;
}

/* ================= INPUTS ================= */
.input-group{
  position:relative;
  margin-bottom:25px;
}

.input-group input{
  width:100%;
  padding:14px 12px;
  background:transparent;
  border:none;
  border-bottom:2px solid #444;
  color:#fff;
  font-size:15px;
  outline:none;
}

.input-group label{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:#aaa;
  pointer-events:none;
  transition:0.3s;
}

/* Floating label */
.input-group input:focus + label,
.input-group input:valid + label{
  top:-6px;
  font-size:12px;
  color:#c77735;
}

/* ================= BUTTON ================= */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  background:#c77735;
  color:#000;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#a85f28;
}

/* ================= LOGIN LINK ================= */
.login-link{
  margin-top:20px;
  text-align:center;
  font-size:14px;
}

.login-link a{
  color:#c77735;
  text-decoration:none;
  font-weight:600;
}

/* ================= ANIMATION ================= */
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ================= RESPONSIVE ================= */
@media(max-width:480px){
  .register-box{
    padding:35px 25px;
  }
}
a{
  text-decoration: none;
  color: black;
}
</style>
</head>

<body>

<div class="register-box">
  <h2>Create Account</h2>
  <p>Join Honnesha Café to order online, reserve tables, and save favorites ☕</p>

  <form onsubmit="window.location.href = 'index.html'; return false;">
    <div class="input-group">
      <input type="text" id="full-name" name="full-name" autocomplete="name" required>
      <label for="full-name">Full Name</label>
    </div>

    <div class="input-group">
      <input type="email" id="email" name="email" autocomplete="email" required>
      <label for="email">Email Address</label>
    </div>

    <div class="input-group">
      <input type="tel" id="mobile" name="mobile" autocomplete="tel" required>
      <label for="mobile">Mobile Number</label>
    </div>

    <div class="input-group">
      <input type="password" id="new-password" name="new-password" autocomplete="new-password" required>
      <label for="new-password">Password</label>
    </div>

    <div class="input-group">
      <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
      <label for="confirm-password">Confirm Password</label>
    </div>

   <button type="submit">Register</button>

    <div class="login-link">
      Already have an account?
      <a href="login.html">Login</a>
    </div>
  </form>
</div>

</body>
</html>
