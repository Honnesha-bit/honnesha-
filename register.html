<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ShopKart | Create account</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="my.css"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>ShopKart</span></a><p class="eyebrow">Create your account</p><h1>Start shopping smarter.</h1><p class="auth-copy">Create a profile to track orders and save your favorites.</p><form class="auth-form" onsubmit="window.location.href='account.html';return false;"><label>Full name<input type="text" autocomplete="name" required></label><label>Email address<input type="email" autocomplete="email" required></label><label>Phone number<input type="tel" autocomplete="tel" required></label><label>Password<input type="password" autocomplete="new-password" required></label><button class="btn btn-primary" type="submit">Create account</button></form><p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p></main></body></html>
