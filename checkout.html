<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ShopKart | Checkout</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="my.css"></head><body><header class="site-header"><nav class="navbar"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>ShopKart</span></a><ul class="nav-links compact-links"><li><a href="cart.html">← Back to cart</a></li></ul></nav></header><main class="page-shell"><section class="page-hero"><p class="eyebrow">Almost there</p><h1>Checkout</h1><p>Add your delivery details and choose Cash on Delivery for this first working version.</p></section><form class="checkout-panel" id="checkout-form"><div class="checkout-steps"><span>1. Address</span><span>→</span><span>2. Delivery</span><span>→</span><span>3. Payment</span></div><div class="form-grid"><div class="field"><label for="name">Full name</label><input id="name" autocomplete="name" required></div><div class="field"><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel" required></div><div class="field wide"><label for="address">House / building and street</label><textarea id="address" required></textarea></div><div class="field"><label for="city">City</label><input id="city" required></div><div class="field"><label for="pincode">Pincode</label><input id="pincode" inputmode="numeric" required></div></div><label class="payment-choice"><input type="radio" checked name="payment"> <span><strong>Cash on Delivery</strong><br>Pay when your order arrives.</span></label><button class="btn btn-primary full-btn" type="submit">Place order</button></form></main><script src="script.js"></script></body></html>
