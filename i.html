<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>

<style>
/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

/* ===== BACKGROUND ===== */
body {
  height: 100vh;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== LOGIN CARD ===== */
.login-box {
  width: 360px;
  padding: 40px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 15px;
  backdrop-filter: blur(10px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  animation: fadeIn 1s ease;
}

/* ===== ANIMATION ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== TEXT ===== */
.login-box h2 {
  text-align: center;
  color: #fff;
  margin-bottom: 10px;
}

.login-box p {
  text-align: center;
  color: #ddd;
  margin-bottom: 30px;
  font-size: 14px;
}

/* ===== INPUTS ===== */
.input-box {
  position: relative;
  margin-bottom: 25px;
}

.input-box input {
  width: 100%;
  padding: 10px;
  border: none;
  outline: none;
  background: transparent;
  border-bottom: 2px solid #ccc;
  color: #fff;
  font-size: 16px;
}

.input-box label {
  position: absolute;
  top: 10px;
  left: 0;
  color: #ccc;
  pointer-events: none;
  transition: 0.3s;
}

.input-box input:focus ~ label,
.input-box input:valid ~ label {
  top: -10px;
  font-size: 12px;
  color: #00eaff;
}

/* ===== BUTTON ===== */
button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 25px;
  background: #00eaff;
  color: #000;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #00bcd4;
}

/* ===== EXTRA LINKS ===== */
.extra {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
}

.extra a {
  color: #00eaff;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>Welcome Back</h2>
  <p>Login to continue</p>

  <form onsubmit="return login()">
    <div class="input-box">
      <input type="text" id="username" required>
      <label>Username</label>
    </div>

    <div class="input-box">
      <input type="password" id="password" required>
      <label>Password</label>
    </div>
    <button onclick="alert('sucess fully log in' )"><a href="index.html">Log In</a></button>
    <div class="extra">
      <p>New user? <a href="register.html">Register</a></p>
    </div>
  </form>
</div>
</body>
</html>
